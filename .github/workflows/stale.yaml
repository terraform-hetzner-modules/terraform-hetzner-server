name: "Close stale Issues & Pull Requests"

on:
  schedule:
    - cron: "30 18 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    name: Mark issues and PRs as stale
    runs-on: ubuntu-latest
    permissions:
      issues: write # Label and close inactive issues.
      pull-requests: write # Label and close inactive pull requests.
    steps:
      - name: Mark and close stale items
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # see https://github.com/actions/stale#all-options
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          close-issue-label: stale
          close-issue-message: false
          close-pr-label: stale
          close-pr-message: false
          days-before-stale: 30
          days-before-close: 60
          exempt-issue-labels: pinned, security
          exempt-pr-labels: pinned, security
          stale-issue-label: stale
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions."
          stale-pr-label: stale
          stale-pr-message: "This PR has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions."
